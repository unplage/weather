<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>随行天气 · 和风全功能</title>
  <!-- CSP：仅允许本站 + 和风 CDN + bigdatacloud 定位；inline-script 因 clear.html 独立页不在此列 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.qweatherapi.com https://*.qweather.com https://api.bigdatacloud.net https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1E88E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- 和风天气图标库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/qweather-icons@1.8.0/font/qweather-icons.css" integrity="sha384-TsXGvarQaEKM+t5lcNuENHRayesPS+C36oZcteKU7Iy3TYMudT/Ygs7IJKsAJJwC" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#app">跳到主要内容</a>
<div class="container" id="app">
  <header class="city-bar">
    <div class="city-info">
      <h1 class="city-name" id="cityName">定位中...</h1>
      <button class="locate-btn" id="locateBtn" type="button" title="重新 GPS 定位" aria-label="重新 GPS 定位">📍</button>
      <span class="updated-at" id="updatedAt" aria-live="polite"></span>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <div class="search-box" role="search">
          <label class="visually-hidden" for="searchInput">搜索城市</label>
          <input type="text" id="searchInput" placeholder="搜索城市" autocomplete="off" aria-label="搜索城市">
          <button id="searchBtn" type="button" aria-label="搜索">🔍</button>
        </div>
        <div class="search-error" id="searchError" role="alert" aria-live="assertive"></div>
      </div>
      <div class="settings-area">
        <span class="key-status" id="keyStatus">未设置</span>
        <button class="settings-btn" id="settingsBtn" type="button" title="设置和风 API Host 与 Key" aria-label="打开设置">⚙️</button>
      </div>
      <button class="settings-btn" id="citiesBtn" type="button" title="收藏与最近城市" aria-label="收藏与最近城市" aria-expanded="false" style="width:36px;height:36px;font-size:16px;">🏙️</button>
      <button class="settings-btn" id="unitToggleBtn" type="button" title="切换 °C/°F" aria-label="切换温度单位" style="width:36px;height:36px;font-size:13px;font-weight:700;">°C</button>
      <button class="settings-btn" id="themeToggleBtn" type="button" title="深色/浅色模式" aria-label="切换深色模式" style="width:36px;height:36px;font-size:16px;">🌙</button>
      <button class="cache-badge" id="cacheBadge" type="button" style="display:none;" title="当前为缓存数据，点击强制刷新">缓存</button>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="刷新天气数据">⟳</button>
      <button class="settings-btn" id="installBtn" type="button" title="安装应用" aria-label="安装应用" style="display:none; width:36px; height:36px; font-size:18px;">⬇️</button>
    </div>
  </header>

  <!-- 预警卡片 -->
  <div class="alert-card" id="alertCard" role="alert" aria-live="assertive">
    <div class="alert-title">⚠️ 天气预警</div>
    <div id="alertContent" class="alert-text"></div>
  </div>

  <!-- 实时天气 -->
  <section class="card" id="currentCard" aria-label="实时天气">
    <div class="temp-row">
      <div>
        <span class="now-temp" id="tempNow">--<small>°</small></span>
        <div class="weather-desc" id="weatherDesc">---</div>
      </div>
      <div class="high-low" id="highLow">最高 -- / 最低 --</div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">💧</span><div><div class="detail-label">湿度</div><div class="detail-value" id="humidity">--%</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🌬️</span><div><div class="detail-label">风速</div><div class="detail-value" id="windSpeed">--</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🌡️</span><div><div class="detail-label">体感</div><div class="detail-value" id="feelsLike">--</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🫁</span><div><div class="detail-label">空气质量</div><div class="detail-value" id="aqi">--</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">☁️</span><div><div class="detail-label">云量</div><div class="detail-value" id="cloud">--</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🌫️</span><div><div class="detail-label">能见度</div><div class="detail-value" id="visibility">--</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🌀</span><div><div class="detail-label">气压</div><div class="detail-value" id="pressure">-- hPa</div></div></div>
      <div class="detail-item"><span class="detail-icon" aria-hidden="true">🌦️</span><div><div class="detail-label">降水</div><div class="detail-value" id="precip">-- mm</div></div></div>
    </div>
  </section>

  <!-- 逐小时 -->
  <section class="card" aria-label="逐小时天气">
    <div class="section-title">
      <span>⏱️ 逐小时天气</span>
      <button class="link-btn" id="hourlyToggleBtn" type="button" aria-pressed="false">展开 240h</button>
    </div>
    <div class="hourly-scroll" id="hourlyContainer" tabindex="0" role="list"><div class="loading">加载中...</div></div>
  </section>

  <!-- 7日 / 10天 -->
  <section class="card" aria-label="未来预报">
    <div class="section-title">
      <span>📅 未来7天</span>
      <button class="link-btn" id="dailyToggleBtn" type="button" aria-pressed="false">展开 10天</button>
    </div>
    <div class="daily-list" id="dailyContainer"><div class="loading">加载中...</div></div>
  </section>

  <!-- 分钟降水 -->
  <section class="card" id="minutelyCard" style="display:none;" aria-label="分钟级降水预报">
    <div class="section-title">🌧️ 分钟级降水预报</div>
    <div class="minutely-container" id="minutelyContainer" role="img" aria-label="未来两小时降水柱状图"></div>
    <div class="minute-axis" id="minutelyAxis"></div>
    <div class="minutely-summary" id="minutelySummary" aria-live="polite"></div>
  </section>

  <!-- 生活指数 -->
  <section class="card" id="indicesCard" style="display:none;" aria-label="生活指数">
    <div class="section-title">🌟 生活指数</div>
    <div class="indices-grid" id="indicesGrid"></div>
  </section>

  <footer id="footer">数据源: 和风天气 · 个人PWA</footer>
</div>

<!-- 收藏 / 最近城市面板 -->
<div class="settings-overlay" id="citiesPanel">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-label="收藏与最近城市">
    <h3>🏙️ 我的城市</h3>
    <div id="citiesList"></div>
    <div class="settings-actions">
      <button class="btn-secondary" id="citiesCloseBtn" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 城市选择器（搜索多结果消歧） -->
<div class="settings-overlay" id="cityPickerOverlay">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-label="选择城市">
    <h3>🏙️ 选择城市</h3>
    <div id="cityPickerList"></div>
    <div class="settings-actions">
      <button class="btn-secondary" id="cityPickerCancelBtn" type="button">取消</button>
    </div>
  </div>
</div>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-label="和风天气设置">
    <h3>⚙️ 和风天气设置</h3>
    <div class="form-error" id="settingsError" role="alert"></div>
    <div class="form-success" id="settingsSuccess" role="status"></div>
    <label for="apiHostInput">API Host（专属域名）</label>
    <input type="text" id="apiHostInput" placeholder="例如: https://m33wt3jj26.re.qweatherapi.com" autocomplete="off" spellcheck="false">
    <div class="hint">从 <a href="https://console.qweather.com/setting/" target="_blank" rel="noopener noreferrer">控制台设置</a> 获取</div>

    <label for="apiKeyInput">API Key</label>
    <input type="password" id="apiKeyInput" placeholder="您的和风天气 Key" autocomplete="off" spellcheck="false" aria-describedby="keyHint">
    <div class="hint" id="keyHint">默认通过请求头 <code>X-QW-Api-Key</code> 发送；保存时会自动校验</div>

    <div class="settings-actions">
      <button class="btn-secondary" id="cancelSettingsBtn" type="button">取消</button>
      <button class="btn-primary" id="saveSettingsBtn" type="button">保存</button>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>

<script src="./app.js" defer></script>
</body>
</html>
